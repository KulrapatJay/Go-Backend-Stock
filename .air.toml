root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "json", "yaml", "html", "js", "css"]
  exclude_dir = ["tmp", "bin", "web", "docs/superpowers", "docs/adr", "docs/database", "migrations"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true

[log]
  time = false
