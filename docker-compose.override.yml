# Loaded automatically by `docker compose up`. Development only: source mount + hot reload.
services:
  api:
    build:
      context: .
      target: dev
      args:
        AIR_VERSION: v1.67.4
    image: stock-portfolio-api:dev
    working_dir: /src
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
    healthcheck:
      test: ["CMD", "/src/tmp/api", "healthcheck"]
      start_period: 60s

volumes:
  gomodcache:
