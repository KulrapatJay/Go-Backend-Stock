  /api/v1/portfolios/{portfolio_id}/valuation:
    get:
      description: 'Prices every stock still held with a delayed reference price:
        the close of the last bar before 15 minutes ago. It is not a bid or ask price
        and not a price one could trade at; each quote says so in price_type (delayed_bar_close)
        and delay_minutes (15), so label the price from those fields. A price that
        is missing is null and never "0": coverage says whether every stock still
        held has a price (complete), some do (partial) or none does (unavailable,
        which is also the answer when the price provider cannot be reached). Unless
        coverage is complete, market_value, unrealized_pnl and unrealized_pnl_percent
        are null and priced_market_value is only the subtotal of the priced stocks;
        realized_pnl, cost_basis and the holdings never depend on prices. unrealized_pnl
        = quantity x price - remaining cost, without any selling fee. unrealized_pnl_percent
        = unrealized_pnl / cost_basis x 100 and weight_percent = market_value / market_value
        of the portfolio x 100; both are in percent ("8.5" is 8.5%), exact and not
        rounded, and null when they cannot be known (no price, a stock that was sold
        out for unrealized_pnl_percent, coverage that is not complete for weight_percent):
        null never means 0%. With PRICE_PROVIDER=demo the prices are sample data and
        is_demo is true. calculated_at is when the transactions were read. A portfolio
        that belongs to someone else gets exactly the same 404 as one that does not
        exist. Needs the session cookie.'
      operationId: getValuation
      parameters:
      - description: Portfolio ID
        format: uuid
        in: path
        name: portfolio_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ValuationResponse'
        "400":
          description: 'invalid_input: portfolio_id is not a UUID'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Value a portfolio with delayed prices
      tags:
      - Holdings/Prices
  /api/v1/valuation:
    get:
      description: 'The summary for a dashboard: every portfolio of the signed-in
        user valued with the same delayed reference prices as GET /api/v1/portfolios/{portfolio_id}/valuation
        and added up. Each stock is priced once per request, however many portfolios
        hold it. portfolios has one entry per portfolio (newest first, not paged,
        because the totals count all of them) with the totals of its own valuation
        and its share of the account; allocation merges the same stock from every
        portfolio into one row, the largest market_value first, for a chart of what
        the account holds. The rules for missing prices are those of a single portfolio,
        over all of them: coverage is complete only when every stock still held in
        any portfolio has a price; unless it is, market_value, unrealized_pnl and
        unrealized_pnl_percent are null (never "0") and priced_market_value is only
        the subtotal of the priced stocks, while cost_basis and realized_pnl never
        depend on prices. Each portfolio keeps its own coverage, so one portfolio
        can be complete while the account is partial. Percentages are in percent ("8.5"
        is 8.5%), exact and not rounded; weight_percent is null unless the coverage
        of the account is complete. When the price provider cannot be reached the
        answer is still 200 with coverage unavailable. A user without portfolios or
        trades gets zeros and empty lists. Only the caller''s own portfolios are ever
        counted. Needs the session cookie.'
      operationId: getAccountValuation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AccountValuationResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Value every portfolio of the user together
      tags:
      - Holdings/Prices
  /healthz:
    get:
      description: Returns 200 while the process is running. Does not check the database.
      operationId: getHealthz
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              description: Server-generated UUIDv7 for this request
              type: string
          schema:
            $ref: '#/definitions/http.HealthResponse'
      summary: Liveness probe
      tags:
      - Health
  /readyz:
    get:
      description: Pings the database within a 1 second budget. Returns 503 not_ready
        without connection details when it is unreachable.
      operationId: getReadyz
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              description: Server-generated UUIDv7 for this request
              type: string
          schema:
            $ref: '#/definitions/http.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Readiness probe
      tags:
      - Health
swagger: "2.0"
tags:
- description: Liveness and readiness probes
  name: Health
- description: Registration, email verification, sessions and CSRF tokens. Every POST
    needs the X-CSRF-Token header from GET /api/v1/auth/csrf and must come from the
    API's own origin.
  name: Auth
- description: 'Forgot-password flow with a 6-digit code sent by email: ask for a
    code, then set a new password with it. The answer to the request is the same for
    every email. Every POST needs the X-CSRF-Token header from GET /api/v1/auth/csrf
    and must come from the API''s own origin.'
  name: Password Reset
- description: What a portfolio holds and what it is worth, with delayed prices. A
    price that is missing is null, never zero; realized profit and loss never depends
    on prices. Read-only, needs the session cookie.
  name: Holdings/Prices
- description: A user can own many portfolios, all in USD. Every call needs the session
    cookie; another user's portfolio looks exactly like a missing one (404). Reading
    returns an ETag with the portfolio version; changing or deleting a portfolio needs
    it back in If-Match.
  name: Portfolios
- description: Buys and sells a user recorded in one of their portfolios; the API
    never places orders. Every call needs the session cookie; a portfolio of another
    user looks exactly like a missing one (404). Quantity, price and fee are decimal
    strings. Creating a trade needs an Idempotency-Key, so a retry never records it
    twice; reading returns an ETag with the trade version.
  name: Transactions
