basePath: /
definitions:
  http.AuthConfigResponse:
    properties:
      google_enabled:
        example: true
        type: boolean
    required:
    - google_enabled
    type: object
  http.CSRFResponse:
    properties:
      csrf_token:
        example: AQAAAABnHk3QxJ9b3m0z0bH2l9V1cW5qQk1xU2ZtV0RkY0p0dVhQb0xMZ3hQYnpqUkw
        type: string
      expires_at:
        example: "2026-10-24T10:00:00Z"
        format: date-time
        type: string
    required:
    - csrf_token
    - expires_at
    type: object
  http.ConfirmEmailRequest:
    properties:
      challenge_id:
        example: 0192f0c1-7a8e-7cc4-9d2b-3f6c1a2b4c5d
        type: string
      otp:
        example: "042731"
        type: string
    required:
    - challenge_id
    - otp
    type: object
  http.EmailRequest:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  http.ErrorBody:
    properties:
      code:
        example: not_found
        type: string
      details:
        description: Details lists the rules an input broke, such as password_too_short;
          only on invalid_input.
        example:
        - password_too_short
        - password_missing_special
        items:
          type: string
        type: array
      message:
        example: Not Found
        type: string
      request_id:
        example: 0192f0c1-7a8e-7cc4-9d2b-3f6c1a2b4c5d
        type: string
    required:
    - code
    - message
    - request_id
    type: object
  http.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/http.ErrorBody'
    required:
    - error
    type: object
  http.GoogleStartResponse:
    properties:
      authorization_url:
        example: https://accounts.google.com/o/oauth2/v2/auth?client_id=...&code_challenge=...&code_challenge_method=S256&nonce=...&redirect_uri=...&response_type=code&scope=openid+email&state=...
        type: string
    required:
    - authorization_url
    type: object
  http.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  http.HoldingResponse:
    properties:
      average_cost:
        example: "101"
        type: string
      cost_basis:
        example: "151.5"
        type: string
      instrument_name:
        example: Apple Inc.
        type: string
      quantity:
        example: "1.5"
        type: string
      realized_pnl:
        example: "8.5"
        type: string
      symbol:
        example: AAPL
        type: string
    required:
    - average_cost
    - cost_basis
    - instrument_name
    - quantity
    - realized_pnl
    - symbol
    type: object
  http.HoldingsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.HoldingResponse'
        type: array
    required:
    - data
    type: object
  http.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: Zq9!kVx1
        type: string
    required:
    - email
    - password
    type: object
  http.OTPAcceptedResponse:
    properties:
      challenge_id:
        example: 0192f0c1-7a8e-7cc4-9d2b-3f6c1a2b4c5d
        type: string
      expires_in:
        example: 600
        type: integer
      message:
        example: If this address can receive email, a code has been sent. It expires
          in 10 minutes.
        type: string
    required:
    - challenge_id
    - expires_in
    - message
    type: object
  http.PortfolioPageResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.PortfolioResponse'
        type: array
      next_cursor:
        example: eyJrIjoicG9ydGZvbGlvcyJ9
        type: string
        x-nullable: true
    required:
    - data
    - next_cursor
    type: object
  http.PortfolioRequest:
    properties:
      description:
        example: Buy and hold, reviewed once a year.
        maxLength: 1000
        type: string
      name:
        example: Long term
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  http.PortfolioResponse:
    properties:
      created_at:
        example: "2026-10-29T09:30:00Z"
        format: date-time
        type: string
      currency:
        enum:
        - USD
        example: USD
        type: string
      description:
        example: Buy and hold, reviewed once a year.
        type: string
      id:
        example: 0192f0c1-7a8e-7cc4-9d2b-3f6c1a2b4c5d
        type: string
      name:
        example: Long term
        type: string
      updated_at:
        example: "2026-10-29T09:30:00Z"
        format: date-time
        type: string
      version:
        example: 1
        type: integer
    required:
    - created_at
    - currency
    - description
    - id
    - name
    - updated_at
    - version
    type: object
  http.PositionResponse:
    properties:
      average_cost:
        example: "101"
        type: string
      cost_basis:
        example: "151.5"
        type: string
      instrument_name:
        example: Apple Inc.
        type: string
      market_value:
        example: "165"
        type: string
        x-nullable: true
      quantity:
        example: "1.5"
        type: string
      quote:
        allOf:
        - $ref: '#/definitions/http.QuoteResponse'
        x-nullable: true
      realized_pnl:
        example: "8.5"
        type: string
      symbol:
        example: AAPL
        type: string
      unavailable_reason:
        enum:
        - no_price
        - provider_unavailable
        example: no_price
        type: string
        x-nullable: true
      unrealized_pnl:
        example: "13.5"
        type: string
        x-nullable: true
    required:
    - average_cost
    - cost_basis
    - instrument_name
    - market_value
    - quantity
    - quote
    - realized_pnl
    - symbol
    - unavailable_reason
    - unrealized_pnl
    type: object
  http.QuoteResponse:
    properties:
      as_of:
        example: "2026-11-04T14:30:00Z"
        format: date-time
        type: string
      cached:
        example: false
        type: boolean
      currency:
        enum:
        - USD
        example: USD
        type: string
      feed:
        example: demo
        type: string
      fetched_at:
        example: "2026-11-04T14:46:00Z"
        format: date-time
        type: string
      is_demo:
        example: true
        type: boolean
      price:
        example: "110"
        type: string
      session_status:
        enum:
        - open
        - market_closed
        - unknown
        example: unknown
        type: string
      source:
        example: demo
        type: string
      stale:
        example: false
        type: boolean
    required:
    - as_of
    - cached
    - currency
    - feed
    - fetched_at
    - is_demo
    - price
    - session_status
    - source
    - stale
    type: object
  http.ReadyResponse:
    properties:
      status:
        example: ready
        type: string
    type: object
  http.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: Zq9!kVx1
        type: string
    required:
    - email
    - password
    type: object
  http.ResetPasswordRequest:
    properties:
      challenge_id:
        example: 0192f0c1-7a8e-7cc4-9d2b-3f6c1a2b4c5d
        type: string
      new_password:
        example: Zq9!kVx1
        type: string
      otp:
        example: "042731"
        type: string
    required:
    - challenge_id
    - new_password
    - otp
    type: object
  http.SessionResponse:
    properties:
      expires_at:
        example: "2026-10-31T09:30:00Z"
        format: date-time
        type: string
      user:
        $ref: '#/definitions/http.UserResponse'
    required:
    - expires_at
    - user
    type: object
  http.TransactionPageResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/http.TransactionResponse'
        type: array
      next_cursor:
        example: eyJrIjoidHJhbnNhY3Rpb25zIn0
        type: string
        x-nullable: true
    required:
    - data
    - next_cursor
    type: object
  http.TransactionRequest:
    properties:
      executed_at:
        example: "2026-10-01T14:30:00Z"
        format: date-time
        type: string
      fee:
        example: "1"
        type: string
      price:
        example: "200.25"
        type: string
      quantity:
        example: "0.5"
        type: string
      side:
        enum:
        - buy
        - sell
        example: buy
        type: string
      symbol:
        example: AAPL
        maxLength: 15
        minLength: 1
        type: string
    required:
    - executed_at
    - fee
    - price
    - quantity
    - side
    - symbol
    type: object
  http.TransactionResponse:
    properties:
      created_at:
        example: "2026-10-29T09:30:00Z"
        format: date-time
        type: string
      executed_at:
        example: "2026-10-01T14:30:00Z"
        format: date-time
        type: string
      fee:
        example: "1"
        type: string
      id:
        example: 0192f0c1-7a8e-7cc4-9d2b-3f6c1a2b4c5d
        type: string
      portfolio_id:
        example: 0192f0c1-7a8e-7cc4-9d2b-3f6c1a2b4c5e
        type: string
      price:
        example: "200.25"
        type: string
      quantity:
        example: "0.5"
        type: string
      sequence:
        example: "42"
        type: string
      side:
        enum:
        - buy
        - sell
        example: buy
        type: string
      symbol:
        example: AAPL
        type: string
      updated_at:
        example: "2026-10-29T09:30:00Z"
        format: date-time
        type: string
      version:
        example: 1
        type: integer
    required:
    - created_at
    - executed_at
    - fee
    - id
    - portfolio_id
    - price
    - quantity
    - sequence
    - side
    - symbol
    - updated_at
    - version
    type: object
  http.UpdatePortfolioRequest:
    properties:
      description:
        example: Buy and hold, reviewed once a year.
        maxLength: 1000
        type: string
      name:
        example: Long term
        maxLength: 100
        minLength: 1
        type: string
    required:
    - description
    - name
    type: object
  http.UserResponse:
    properties:
      created_at:
        example: "2026-10-24T09:30:00Z"
        format: date-time
        type: string
      email:
        example: user@example.com
        type: string
      email_verified:
        example: true
        type: boolean
      id:
        example: 0192f0c1-7a8e-7cc4-9d2b-3f6c1a2b4c5d
        type: string
    required:
    - created_at
    - email
    - email_verified
    - id
    type: object
  http.ValuationResponse:
    properties:
      calculated_at:
        example: "2026-11-04T15:00:00Z"
        format: date-time
        type: string
      coverage:
        enum:
        - complete
        - partial
        - unavailable
        example: complete
        type: string
      currency:
        enum:
        - USD
        example: USD
        type: string
      market_value:
        example: "165"
        type: string
        x-nullable: true
      missing_symbols:
        example:
        - MSFT
        - NVDA
        items:
          type: string
        type: array
      portfolio_id:
        example: 0192f0c1-7a8e-7cc4-9d2b-3f6c1a2b4c5d
        type: string
      positions:
        items:
          $ref: '#/definitions/http.PositionResponse'
        type: array
      priced_market_value:
        example: "165"
        type: string
      realized_pnl:
        example: "8.5"
        type: string
      unrealized_pnl:
        example: "13.5"
        type: string
        x-nullable: true
    required:
    - calculated_at
    - coverage
    - currency
    - market_value
    - missing_symbols
    - portfolio_id
    - positions
    - priced_market_value
    - realized_pnl
    - unrealized_pnl
    type: object
info:
  contact: {}
  description: |-
    Records US stock trades and tracks portfolio cost and P&L. It does not place real orders.
    Phase 1 covers sign-up with email verification (OTP), login and logout with a server-side session cookie, Google sign-in and linking, password reset (OTP), many portfolios per user, recording, editing and deleting buys and sells, and holdings and valuation with delayed prices: sample prices in demo mode (PRICE_PROVIDER=demo) and delayed SIP prices from Alpaca when PRICE_PROVIDER=alpaca. Dividends, splits, mergers and symbol changes are not handled, and results are not tax reports.
  title: Stock Portfolio Tracker API
  version: "1.0"
paths:
  /api/v1/auth/config:
    get:
      description: Tells a client whether Google sign-in is configured. When google_enabled
        is false, the Google endpoints answer 503 feature_disabled.
      operationId: getAuthConfig
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AuthConfigResponse'
        "500":
          description: internal, such as a recovered panic
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get the sign-in options
      tags:
      - Auth
  /api/v1/auth/csrf:
    get:
      description: Returns the token to send in the X-CSRF-Token header of every POST.
        Signed in, the token is bound to the session; signed out, it is bound to a
        random nonce that this call keeps in the HttpOnly cookie csrf_nonce (__Host-csrf_nonce
        over HTTPS). Tokens last one hour. Ask for a new token after login and after
        logout, because the binding changes. Browsers (and Swagger UI) send the cookie
        by themselves; curl needs a cookie jar (-b/-c).
      operationId: getCSRFToken
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: csrf_nonce=…; Path=/; HttpOnly; SameSite=Lax — only when
                signed out
              type: string
          schema:
            $ref: '#/definitions/http.CSRFResponse'
        "503":
          description: 'dependency_unavailable: the session store could not be reached'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get a CSRF token
      tags:
      - Auth
  /api/v1/auth/email-verification/confirm:
    post:
      consumes:
      - application/json
      description: 'Checks the 6-digit code sent by register or by "send a new code".
        A wrong, expired, already used or exhausted code (5 wrong tries) gives the
        same 400 invalid_verification. Success verifies the email but does not sign
        in: call POST /api/v1/auth/login next. Needs X-CSRF-Token and the csrf_nonce
        cookie.'
      operationId: confirmEmailVerification
      parameters:
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: challenge_id from the 202 response and the 6 ASCII digits from
          the email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.ConfirmEmailRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Email verified
        "400":
          description: invalid_verification, invalid_input or malformed_json
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "429":
          description: rate_limited; wait Retry-After seconds
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Confirm an email address
      tags:
      - Auth
  /api/v1/auth/email-verification/request:
    post:
      consumes:
      - application/json
      description: Sends a new 6-digit code to an account that registered with a password
        and is not verified yet, and invalidates its previous code. The answer is
        the same for every email, so it does not reveal whether an account exists;
        register and this endpoint share one quota per email (one code a minute, five
        an hour). Needs X-CSRF-Token and the csrf_nonce cookie.
      operationId: requestEmailVerification
      parameters:
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: The email to send a code to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.EmailRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/http.OTPAcceptedResponse'
        "400":
          description: invalid_input or malformed_json
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "429":
          description: rate_limited; wait Retry-After seconds
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Send a new verification code
      tags:
      - Auth
  /api/v1/auth/google/callback:
    get:
      description: 'Google sends the browser here after GET authorization_url. It
        is not called directly: it needs the state from that URL and the oidc_binding
        cookie of the browser that started the flow, and it takes no X-CSRF-Token
        (the state, the binding and the ID token''s nonce protect it). It always clears
        oidc_binding and answers 303 to /docs/?google=success (signed in: the session
        cookie is set), linked (Google added to the signed-in account), link_required
        (the email belongs to an account: sign in to it and use POST /api/v1/auth/google/link)
        or failed (cancelled, expired, replayed, another browser, or refused). Infrastructure
        failures answer JSON instead.'
      operationId: completeGoogleSignIn
      parameters:
      - description: Authorization code from Google
        in: query
        name: code
        type: string
      - description: The state of the flow
        in: query
        name: state
        type: string
      - description: Set by Google when the user cancelled
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "303":
          description: Redirect to /docs/?google=success|linked|link_required|failed
          headers:
            Location:
              description: /docs/?google=success
              type: string
            Set-Cookie:
              description: oidc_binding=; Expires=Tue, 10 Nov 2009 23:00:00 GMT —
                and session=… on success
              type: string
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: feature_disabled (Google is not configured) or dependency_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Come back from Google
      tags:
      - Auth
  /api/v1/auth/google/link:
    post:
      description: 'Like POST /api/v1/auth/google/start, but the flow belongs to the
        signed-in user: after Google, the callback adds the Google account to this
        account (/docs/?google=linked) without opening a new session. The callback
        must come with the same session. Needs the session cookie and an X-CSRF-Token
        bound to it.'
      operationId: linkGoogleAccount
      parameters:
      - description: Token from GET /api/v1/auth/csrf, fetched while signed in
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: oidc_binding=…; Path=/; Expires=…; HttpOnly; SameSite=Lax
              type: string
          schema:
            $ref: '#/definitions/http.GoogleStartResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "429":
          description: rate_limited; wait Retry-After seconds
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: feature_disabled or dependency_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Link Google to the signed-in account
      tags:
      - Auth
  /api/v1/auth/google/start:
    post:
      description: 'Returns the Google URL to open in the same browser, and sets the
        HttpOnly cookie oidc_binding (__Host-oidc_binding over HTTPS) that must come
        back with the callback; the flow lasts 10 minutes. Google sends the browser
        to GET /api/v1/auth/google/callback, which ends at /docs/?google=success|link_required|failed.
        A Google account whose email already belongs to an account is not linked automatically:
        sign in to that account and use POST /api/v1/auth/google/link. Needs X-CSRF-Token
        and the csrf_nonce cookie. Swagger UI and curl cannot complete the Google
        page; open authorization_url in the browser.'
      operationId: startGoogleSignIn
      parameters:
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: oidc_binding=…; Path=/; Expires=…; HttpOnly; SameSite=Lax
              type: string
          schema:
            $ref: '#/definitions/http.GoogleStartResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "429":
          description: rate_limited; wait Retry-After seconds
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: feature_disabled (Google is not configured) or dependency_unavailable
            (Google cannot be reached)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Start signing in with Google
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 'Opens a session and sets it in the HttpOnly cookie session (__Host-session
        over HTTPS; SameSite=Lax, Path=/); the body only describes it. An unknown
        email, a wrong password and an account that signs in only with Google all
        give the same 401. The right password of an account whose email is not verified
        gives 403 email_not_verified. The pre-login csrf_nonce cookie is cleared:
        call GET /api/v1/auth/csrf again for a token bound to the new session. Needs
        X-CSRF-Token.'
      operationId: login
      parameters:
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Email and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: session=…; Path=/; Expires=…; HttpOnly; SameSite=Lax
              type: string
          schema:
            $ref: '#/definitions/http.SessionResponse'
        "400":
          description: invalid_input or malformed_json
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: invalid_credentials
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: email_not_verified or csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "429":
          description: rate_limited; wait Retry-After seconds
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: server_busy (wait Retry-After seconds) or dependency_unavailable
          headers:
            Retry-After:
              description: Seconds to wait (server_busy)
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Sign in with an email and a password
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: 'Revokes the current session on the server and clears the session
        cookie. Without an active session (none, expired or already revoked) it only
        clears the cookie and still answers 204. Needs X-CSRF-Token: signed in, a
        token bound to the session; otherwise one bound to the csrf_nonce cookie.'
      operationId: logout
      parameters:
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              description: session=; Path=/; Expires=Tue, 10 Nov 2009 23:00:00 GMT;
                HttpOnly; SameSite=Lax
              type: string
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Sign out
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Needs the session cookie from POST /api/v1/auth/login.
      operationId: getCurrentUser
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.UserResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: 'dependency_unavailable: the session store could not be reached'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get the signed-in account
      tags:
      - Auth
  /api/v1/auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      description: 'Checks the 6-digit code sent by "ask for a password reset code"
        and replaces the password. A code works once and may be tried wrong 5 times;
        a wrong, expired, already used, exhausted or unknown code all give the same
        400 invalid_reset. The new password follows the same rules as register; the
        rule that it must not contain the part of the email before "@" is checked
        only after the code is right, so a wrong code never reveals anything about
        the account. Each IP address can try 20 times in 15 minutes. Success verifies
        the email, signs the account out on every device, sends a notice email and
        does not sign in: call POST /api/v1/auth/login next. Needs X-CSRF-Token and
        the csrf_nonce cookie.'
      operationId: confirmPasswordReset
      parameters:
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: challenge_id from the 202 response, the 6 ASCII digits from the
          email and the new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Password changed
        "400":
          description: invalid_reset, invalid_input (password rules, details lists
            the reasons) or malformed_json
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "429":
          description: rate_limited; wait Retry-After seconds
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Set a new password with the reset code
      tags:
      - Password Reset
  /api/v1/auth/password-reset/request:
    post:
      consumes:
      - application/json
      description: Sends a 6-digit code, valid for 10 minutes, to an account that
        has a password, and invalidates the code sent before. The answer is the same
        for every email, so it does not reveal whether an account exists; an account
        that signed up only with Google has no password and gets no code. Each email
        can ask once a minute and five times an hour, and each IP address 20 times
        an hour. Needs X-CSRF-Token and the csrf_nonce cookie.
      operationId: requestPasswordReset
      parameters:
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: The email to send a code to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.EmailRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/http.OTPAcceptedResponse'
        "400":
          description: invalid_input or malformed_json
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "429":
          description: rate_limited; wait Retry-After seconds
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Ask for a password reset code
      tags:
      - Password Reset
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 'Creates an unverified account and emails a 6-digit verification
        code. The answer is the same whether or not the email already has an account:
        the owner of an existing account gets an email notice instead and nothing
        changes. The response takes at least about half a second on purpose. Needs
        the pre-login CSRF flow: call GET /api/v1/auth/csrf first, send its token
        in X-CSRF-Token, and send the csrf_nonce cookie (a browser does this itself).
        Then confirm the code with POST /api/v1/auth/email-verification/confirm.'
      operationId: register
      parameters:
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Email, and a password of 6-32 printable ASCII characters without
          spaces, with a lower-case letter, an upper-case letter and a special character
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/http.OTPAcceptedResponse'
        "400":
          description: invalid_input (details lists every broken password rule) or
            malformed_json
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "429":
          description: rate_limited; wait Retry-After seconds
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: server_busy (wait Retry-After seconds) or dependency_unavailable
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Register with an email and a password
      tags:
      - Auth
  /api/v1/portfolios:
    get:
      description: Newest first. Pass the next_cursor of a page as cursor to get the
        following page; next_cursor is null on the last page. A cursor is opaque and
        only valid for the user it was issued to. Other users' portfolios never appear.
      operationId: listPortfolios
      parameters:
      - default: 20
        description: Page size, 1-100 (default 20)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: next_cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.PortfolioPageResponse'
        "400":
          description: 'invalid_input: bad limit or cursor'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List the portfolios of the signed-in user
      tags:
      - Portfolios
    post:
      consumes:
      - application/json
      description: Adds a portfolio for the signed-in user. A user can have many portfolios
        (for example long term, short term and speculative); every portfolio uses
        USD. The name is trimmed, must be 1-100 characters and must not repeat another
        portfolio name of the same user, ignoring letter case (409 portfolio_name_conflict);
        another user may use the same name. The ETag header carries the version to
        send in If-Match when you change or delete the portfolio. Needs the session
        cookie and X-CSRF-Token.
      operationId: createPortfolio
      parameters:
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: Name and optional description
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.PortfolioRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            ETag:
              description: The portfolio version number wrapped in double quotes
              type: string
          schema:
            $ref: '#/definitions/http.PortfolioResponse'
        "400":
          description: invalid_input or malformed_json
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: portfolio_name_conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Create a portfolio
      tags:
      - Portfolios
  /api/v1/portfolios/{portfolio_id}:
    delete:
      description: Deletes a portfolio that has no transactions; a portfolio with
        transactions is kept and the call gives 409 portfolio_not_empty (history is
        never deleted silently). Needs If-Match with the ETag of your last read, like
        PUT. A portfolio of another user gives the same 404 as one that does not exist.
        Needs the session cookie and X-CSRF-Token.
      operationId: deletePortfolio
      parameters:
      - description: Portfolio ID
        format: uuid
        in: path
        name: portfolio_id
        required: true
        type: string
      - description: 'ETag of the last read: the version number wrapped in double
          quotes'
        in: header
        name: If-Match
        required: true
        type: string
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
        "400":
          description: invalid_input (portfolio_id or If-Match)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: portfolio_not_empty
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "412":
          description: 'version_conflict: read the portfolio again'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "428":
          description: 'precondition_required: send If-Match'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Delete an empty portfolio
      tags:
      - Portfolios
    get:
      description: A portfolio that belongs to someone else gets exactly the same
        404 as one that does not exist. The ETag header carries the version to send
        in If-Match.
      operationId: getPortfolio
      parameters:
      - description: Portfolio ID
        format: uuid
        in: path
        name: portfolio_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The portfolio version number wrapped in double quotes
              type: string
          schema:
            $ref: '#/definitions/http.PortfolioResponse'
        "400":
          description: 'invalid_input: portfolio_id is not a UUID'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get one portfolio
      tags:
      - Portfolios
    put:
      consumes:
      - application/json
      description: 'Replaces the name and description: send both, a body without description
        is refused with 400 and nothing is written (send an empty string to clear
        it). Send the ETag of your last read in If-Match, for example "3" with the
        quotes: without it the call is refused with 428 precondition_required; if
        the portfolio changed since (version_conflict) the call is refused with 412
        and nothing is written. Only the exact form "<version>" is accepted: the wildcard
        *, weak validators (W/"3") and lists give 400. A name that another portfolio
        of yours already uses, ignoring letter case, gives 409 portfolio_name_conflict;
        renaming a portfolio to the same name in a different case is allowed. A portfolio
        of another user gives the same 404 as one that does not exist. Needs the session
        cookie and X-CSRF-Token.'
      operationId: updatePortfolio
      parameters:
      - description: Portfolio ID
        format: uuid
        in: path
        name: portfolio_id
        required: true
        type: string
      - description: 'ETag of the last read: the version number wrapped in double
          quotes'
        in: header
        name: If-Match
        required: true
        type: string
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: New name and description; description is required, send an empty
          string to clear it
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdatePortfolioRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The new version number wrapped in double quotes
              type: string
          schema:
            $ref: '#/definitions/http.PortfolioResponse'
        "400":
          description: invalid_input (body, portfolio_id or If-Match) or malformed_json
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: portfolio_name_conflict
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "412":
          description: 'version_conflict: read the portfolio again'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "428":
          description: 'precondition_required: send If-Match'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Rename a portfolio or change its description
      tags:
      - Portfolios
  /api/v1/portfolios/{portfolio_id}/holdings:
    get:
      description: One entry per stock ever traded in the portfolio, sorted by symbol,
        calculated from its transactions with a moving weighted-average cost. A stock
        that was sold out stays with quantity "0" because of its realized profit and
        loss. No prices are used, so this works even when the price provider does
        not. Numbers are exact decimal strings; round them for display only. A portfolio
        that belongs to someone else gets exactly the same 404 as one that does not
        exist. Needs the session cookie.
      operationId: listHoldings
      parameters:
      - description: Portfolio ID
        format: uuid
        in: path
        name: portfolio_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.HoldingsResponse'
        "400":
          description: 'invalid_input: portfolio_id is not a UUID'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List what a portfolio holds
      tags:
      - Holdings/Prices
  /api/v1/portfolios/{portfolio_id}/transactions:
    get:
      description: 'Newest first by executed_at, trades executed at the same time
        by sequence. Pass the next_cursor of a page as cursor to get the following
        page; next_cursor is null on the last page. A cursor is opaque and only valid
        for the portfolio and the filters it was issued for: with other filters it
        gives 400. symbol, side, from and to narrow the list; an empty value does
        not filter. from and to include the instant itself. Write a timezone offset
        such as +02:00 as %2B02:00 in the query. A portfolio of another user gives
        the same 404 as one that does not exist.'
      operationId: listTransactions
      parameters:
      - description: Portfolio ID
        format: uuid
        in: path
        name: portfolio_id
        required: true
        type: string
      - default: 20
        description: Page size, 1-100 (default 20)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: next_cursor of the previous page
        in: query
        name: cursor
        type: string
      - description: Only this symbol, for example AAPL
        in: query
        name: symbol
        type: string
      - description: Only this side
        enum:
        - buy
        - sell
        in: query
        name: side
        type: string
      - description: Only trades executed at or after this RFC 3339 time
        format: date-time
        in: query
        name: from
        type: string
      - description: Only trades executed at or before this RFC 3339 time
        format: date-time
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TransactionPageResponse'
        "400":
          description: 'invalid_input: bad portfolio_id, limit, cursor, symbol, side,
            from or to'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List the trades of a portfolio
      tags:
      - Transactions
    post:
      consumes:
      - application/json
      description: 'Records a buy or sell the user made elsewhere; this API never
        places an order. Every field is required. quantity, price and fee are decimal
        strings (a JSON number is refused with 400 malformed_json): quantity and price
        must be greater than zero, fee may be "0", and each has at most 10 decimals
        and 18 digits before the point. executed_at is an RFC 3339 timestamp with
        a timezone, not in the future and with at most microsecond precision. The
        symbol is upper-cased; a symbol the API has not seen yet is checked with the
        instrument provider (422 unknown_symbol when it does not exist, 503 dependency_unavailable
        when the provider cannot answer, so retry), at most 30 new symbols per user
        per hour (429 rate_limited). The whole history of the portfolio is replayed
        in time order: a sale that would leave fewer than zero shares at any point
        gives 422 insufficient_shares and nothing is written. Idempotency-Key (1-128
        visible ASCII characters) is required: the same key with the same trade returns
        the first result again with 201 and records nothing more; the same key with
        another trade gives 409 idempotency_conflict. A key keeps its result for 24
        hours from the first request. The ETag header carries the version to send
        in If-Match when the trade is changed or deleted. A portfolio of another user
        gives the same 404 as one that does not exist. Needs the session cookie and
        X-CSRF-Token.'
      operationId: createTransaction
      parameters:
      - description: Portfolio ID
        format: uuid
        in: path
        name: portfolio_id
        required: true
        type: string
      - description: Unique key of this request, 1-128 visible ASCII characters, for
          example a UUID
        in: header
        maxLength: 128
        minLength: 1
        name: Idempotency-Key
        required: true
        type: string
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: The trade; every field is required and numbers are decimal strings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.TransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            ETag:
              description: The transaction version number wrapped in double quotes
              type: string
          schema:
            $ref: '#/definitions/http.TransactionResponse'
        "400":
          description: invalid_input (body, portfolio_id or Idempotency-Key) or malformed_json
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "409":
          description: 'idempotency_conflict: the key was used for another trade'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: unknown_symbol or insufficient_shares
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "429":
          description: 'rate_limited: too many new symbols this hour'
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Record a trade in a portfolio
      tags:
      - Transactions
  /api/v1/portfolios/{portfolio_id}/transactions/{transaction_id}:
    delete:
      description: 'Removes the trade and replays the history of the portfolio: a
        deletion that would leave fewer than zero shares at any point (for example
        removing a buy that a later sale needs) gives 422 invalid_history and nothing
        is written. Needs If-Match with the ETag of your last read, like PUT. A trade
        that is not in this portfolio, or in a portfolio of another user, gets the
        same 404 as one that does not exist, and so does a trade that was already
        deleted. Needs the session cookie and X-CSRF-Token.'
      operationId: deleteTransaction
      parameters:
      - description: Portfolio ID
        format: uuid
        in: path
        name: portfolio_id
        required: true
        type: string
      - description: Transaction ID
        format: uuid
        in: path
        name: transaction_id
        required: true
        type: string
      - description: 'ETag of the last read: the version number wrapped in double
          quotes'
        in: header
        name: If-Match
        required: true
        type: string
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
        "400":
          description: invalid_input (portfolio_id, transaction_id or If-Match)
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "412":
          description: 'version_conflict: read the trade again'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: invalid_history
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "428":
          description: 'precondition_required: send If-Match'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Delete a trade
      tags:
      - Transactions
    get:
      description: A trade in a portfolio of another user, or in another portfolio
        of yours, gets exactly the same 404 as one that does not exist. The ETag header
        carries the version to send in If-Match.
      operationId: getTransaction
      parameters:
      - description: Portfolio ID
        format: uuid
        in: path
        name: portfolio_id
        required: true
        type: string
      - description: Transaction ID
        format: uuid
        in: path
        name: transaction_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The transaction version number wrapped in double quotes
              type: string
          schema:
            $ref: '#/definitions/http.TransactionResponse'
        "400":
          description: 'invalid_input: portfolio_id or transaction_id is not a UUID'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get one trade
      tags:
      - Transactions
    put:
      consumes:
      - application/json
      description: 'Replaces the whole trade: send all six fields (symbol, side, quantity,
        price, fee, executed_at) with the same rules as when recording it; a body
        that leaves a field out is refused with 400 and nothing is written. Send the
        ETag of your last read in If-Match: without it the call is refused with 428
        precondition_required; if the trade changed since (version_conflict) the call
        is refused with 412 and nothing is written. Only the exact form of one version
        number wrapped in double quotes is accepted: the wildcard, weak validators
        and lists give 400. The trade stays in its portfolio and keeps its id, sequence
        and created_at; the version goes up by one. A symbol the API has not seen
        yet is checked with the instrument provider (422 unknown_symbol, 503 dependency_unavailable,
        429 rate_limited) like when recording a trade. The whole history of the portfolio
        is replayed in time order: a change that would leave fewer than zero shares
        at any point gives 422 invalid_history and nothing is written. A trade that
        is not in this portfolio, or in a portfolio of another user, gets the same
        404 as one that does not exist. Needs the session cookie and X-CSRF-Token.'
      operationId: updateTransaction
      parameters:
      - description: Portfolio ID
        format: uuid
        in: path
        name: portfolio_id
        required: true
        type: string
      - description: Transaction ID
        format: uuid
        in: path
        name: transaction_id
        required: true
        type: string
      - description: 'ETag of the last read: the version number wrapped in double
          quotes'
        in: header
        name: If-Match
        required: true
        type: string
      - description: Token from GET /api/v1/auth/csrf
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      - description: The whole trade; every field is required and numbers are decimal
          strings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.TransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: The new version number wrapped in double quotes
              type: string
          schema:
            $ref: '#/definitions/http.TransactionResponse'
        "400":
          description: invalid_input (body, portfolio_id, transaction_id or If-Match)
            or malformed_json
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "403":
          description: csrf_failed
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "412":
          description: 'version_conflict: read the trade again'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "422":
          description: unknown_symbol or invalid_history
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "428":
          description: 'precondition_required: send If-Match'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "429":
          description: 'rate_limited: too many new symbols this hour'
          headers:
            Retry-After:
              description: Seconds to wait
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: audit_write_failed or internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Replace a trade
      tags:
      - Transactions
  /api/v1/portfolios/{portfolio_id}/valuation:
    get:
      description: 'Prices every stock still held with a delayed reference price:
        the close of the last bar before 15 minutes ago. It is not a bid or ask price
        and not a price one could trade at. A price that is missing is null and never
        "0": coverage says whether every stock still held has a price (complete),
        some do (partial) or none does (unavailable, which is also the answer when
        the price provider cannot be reached). Unless coverage is complete, market_value
        and unrealized_pnl are null and priced_market_value is only the subtotal of
        the priced stocks; realized_pnl and the holdings never depend on prices. unrealized_pnl
        = quantity x price - remaining cost, without any selling fee. With PRICE_PROVIDER=demo
        the prices are sample data and is_demo is true. calculated_at is when the
        transactions were read. A portfolio that belongs to someone else gets exactly
        the same 404 as one that does not exist. Needs the session cookie.'
      operationId: getValuation
      parameters:
      - description: Portfolio ID
        format: uuid
        in: path
        name: portfolio_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ValuationResponse'
        "400":
          description: 'invalid_input: portfolio_id is not a UUID'
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "401":
          description: unauthenticated
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: internal
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "503":
          description: dependency_unavailable or server_busy
          headers:
            Retry-After:
              description: Seconds to wait; only sent with server_busy, not with dependency_unavailable
              type: integer
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Value a portfolio with delayed prices
      tags:
      - Holdings/Prices
  /healthz:
    get:
      description: Returns 200 while the process is running. Does not check the database.
      operationId: getHealthz
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              description: Server-generated UUIDv7 for this request
              type: string
          schema:
            $ref: '#/definitions/http.HealthResponse'
      summary: Liveness probe
      tags:
      - Health
  /readyz:
    get:
      description: Pings the database within a 1 second budget. Returns 503 not_ready
        without connection details when it is unreachable.
      operationId: getReadyz
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              description: Server-generated UUIDv7 for this request
              type: string
          schema:
            $ref: '#/definitions/http.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Readiness probe
      tags:
      - Health
swagger: "2.0"
tags:
- description: Liveness and readiness probes
  name: Health
- description: Registration, email verification, sessions and CSRF tokens. Every POST
    needs the X-CSRF-Token header from GET /api/v1/auth/csrf and must come from the
    API's own origin.
  name: Auth
- description: 'Forgot-password flow with a 6-digit code sent by email: ask for a
    code, then set a new password with it. The answer to the request is the same for
    every email. Every POST needs the X-CSRF-Token header from GET /api/v1/auth/csrf
    and must come from the API''s own origin.'
  name: Password Reset
- description: What a portfolio holds and what it is worth, with delayed prices. A
    price that is missing is null, never zero; realized profit and loss never depends
    on prices. Read-only, needs the session cookie.
  name: Holdings/Prices
- description: A user can own many portfolios, all in USD. Every call needs the session
    cookie; another user's portfolio looks exactly like a missing one (404). Reading
    returns an ETag with the portfolio version; changing or deleting a portfolio needs
    it back in If-Match.
  name: Portfolios
- description: Buys and sells a user recorded in one of their portfolios; the API
    never places orders. Every call needs the session cookie; a portfolio of another
    user looks exactly like a missing one (404). Quantity, price and fee are decimal
    strings. Creating a trade needs an Idempotency-Key, so a retry never records it
    twice; reading returns an ETag with the trade version.
  name: Transactions
